name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/cli/package.json"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      # Credentials are kept so the tag can be pushed with git, the way it works
      # in the sibling trx pipeline. The gh api call this replaces failed three
      # times across releases with no diagnostic, always after a successful
      # publish, leaving the package on npm with no tag and no release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Pin npm publishing client
        run: npm install --global npm@11.6.4 --registry https://registry.npmjs.org
        working-directory: .

      - name: Detect version change
        id: version
        run: |
          local_version=$(jq -r .version package.json)
          published_version=$(npm view "@crafter/sunat-cli@$local_version" version --registry https://registry.npmjs.org 2>/dev/null || true)
          echo "local=$local_version" >> "$GITHUB_OUTPUT"
          echo "published=$published_version" >> "$GITHUB_OUTPUT"
          if [ -z "$published_version" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --registry https://registry.npmjs.org
        working-directory: .

      - name: Dependency audit
        run: |
          npm audit --audit-level=high
          npm audit signatures
        working-directory: .

      - name: Unit tests
        run: bun test tests/unit

      - name: E2E tests
        run: bun test tests/e2e

      - name: Smoke
        run: bun run bin/sunat.ts -o json cpe doctor

      - name: Build website
        run: npm run build
        working-directory: packages/website

      - name: Build release tarball
        env:
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.release"
          npm pack --pack-destination "$GITHUB_WORKSPACE/.release" --ignore-scripts >/tmp/sunat-pack.txt
          pack_file="$GITHUB_WORKSPACE/.release/crafter-sunat-cli-$VERSION.tgz"
          test -f "$pack_file"
          tar -tzf "$pack_file" >/tmp/sunat-pack-files.txt
          ! grep -E '(^|/)(tests|scripts)/|RESEARCH\.md|CONTEXT\.md|biome\.json|tsconfig\.json' /tmp/sunat-pack-files.txt

      - name: Attest release tarball
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ github.workspace }}/.release/crafter-sunat-cli-${{ steps.version.outputs.local }}.tgz

      - name: Publish with trusted publishing
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.local }}
        run: npm publish "$GITHUB_WORKSPACE/.release/crafter-sunat-cli-$VERSION.tgz" --access public --ignore-scripts --provenance --registry https://registry.npmjs.org

      - name: Verify published artifact
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          local_tarball="$GITHUB_WORKSPACE/.release/crafter-sunat-cli-$VERSION.tgz"
          registry_tarball="$RUNNER_TEMP/crafter-sunat-cli-$VERSION.tgz"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://registry.npmjs.org/@crafter/sunat-cli/-/sunat-cli-$VERSION.tgz" --output "$registry_tarball"; then
              break
            fi
            test "$attempt" != "30"
            sleep 20
          done
          test "$(shasum -a 512 "$local_tarball" | cut -d ' ' -f 1)" = "$(shasum -a 512 "$registry_tarball" | cut -d ' ' -f 1)"
          for attempt in $(seq 1 15); do
            if metadata=$(curl --fail --silent --show-error "https://registry.npmjs.org/@crafter%2fsunat-cli/$VERSION") && echo "$metadata" | jq -e '.dist.attestations.provenance.predicateType == "https://slsa.dev/provenance/v1"' >/dev/null; then
              break
            fi
            test "$attempt" != "15"
            sleep 20
          done
          gh attestation verify "$local_tarball" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main
          workdir=$(mktemp -d)
          cd "$workdir"
          npm install "@crafter/sunat-cli@$VERSION" --ignore-scripts --registry https://registry.npmjs.org
          test "$(./node_modules/.bin/sunat-cli --version)" = "$VERSION"
          ./node_modules/.bin/sunat-cli --help | grep -q "cpe"
          npm install --ignore-scripts --package-lock-only "@crafter/sunat-cli@$VERSION" --registry https://registry.npmjs.org
          npm audit signatures

      - name: Tag and create GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          # git push, not gh api. The API call this replaces died three times
          # across releases in under a second with no gh diagnostic, always
          # after publish had already succeeded. The sibling trx pipeline
          # pushes the tag with git and has not failed here, so this follows
          # the mechanism that works rather than a guess at why the other did
          # not. Idempotent: a tag already pointing at this commit is fine, one
          # pointing elsewhere is a real conflict and must stop the run.
          existing=$(git ls-remote --tags origin "refs/tags/v$VERSION" | awk '{print $1}')
          if [ -n "$existing" ]; then
            test "$existing" = "$GITHUB_SHA"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" "$GITHUB_WORKSPACE/.release/crafter-sunat-cli-$VERSION.tgz" --title "v$VERSION" --generate-notes --verify-tag
          else
            gh release upload "v$VERSION" "$GITHUB_WORKSPACE/.release/crafter-sunat-cli-$VERSION.tgz" --clobber
          fi
          release_tarball="$RUNNER_TEMP/release-crafter-sunat-cli-$VERSION.tgz"
          gh release download "v$VERSION" --pattern "crafter-sunat-cli-$VERSION.tgz" --output "$release_tarball"
          cmp "$GITHUB_WORKSPACE/.release/crafter-sunat-cli-$VERSION.tgz" "$release_tarball"
