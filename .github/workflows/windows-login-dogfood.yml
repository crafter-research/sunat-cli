name: Windows login dogfood

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-login-dogfood.yml"
      - "packages/cli/package.json"
      - "packages/cli/src/browser/**"
      - "packages/cli/src/commands/login.ts"
      - "packages/cli/src/commands/keychain.ts"
      - "packages/cli/src/data/child-process.ts"
      - "packages/cli/src/data/keychain.ts"
      - "packages/cli/tests/fixtures/windows-*"
      - "packages/cli/tests/unit/agent-browser-*"
      - "packages/cli/tests/unit/keychain-privacy.test.ts"

permissions:
  contents: read

jobs:
  login:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Install sunat-cli dependencies
        run: npm ci --ignore-scripts --registry https://registry.npmjs.org
      - name: Build patched sunat-cli
        run: bun run build
        working-directory: packages/cli
      - name: Verify the Windows npm shim
        run: bun test tests/unit/agent-browser-windows-shim.test.ts tests/unit/agent-browser-dependency.test.ts
        working-directory: packages/cli
      - name: Install published baseline
        run: npm install --global @crafter/sunat-cli@0.10.1 --ignore-scripts --registry https://registry.npmjs.org
      - name: Prepare before and after output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages/cli/evidence | Out-Null
          $bun = (Get-Command bun).Source
          $published = Join-Path (npm root --global) "@crafter/sunat-cli/dist/sunat.js"
          $patched = Resolve-Path "packages/cli/dist/sunat.js"
          $originalPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32"
          $env:SUNAT_PASSWORD = "not-a-real-password"
          & $bun $published --output json login --ruc 10123456789 --user TESTUSER *> packages/cli/evidence/before.txt
          & $bun $patched --output json login --ruc 10123456789 --user TESTUSER *> packages/cli/evidence/after.txt
          $env:PATH = $originalPath
          Remove-Item Env:SUNAT_PASSWORD
          if (-not (Select-String -Quiet -Path packages/cli/evidence/before.txt -Pattern "ENOENT|uv_spawn")) { throw "raw ENOENT baseline missing" }
          if (-not (Select-String -Quiet -Path packages/cli/evidence/after.txt -Pattern "agent-browser is not installed")) { throw "guided dependency error missing" }
          exit 0
      - name: Install agent-browser and Chrome
        shell: pwsh
        run: |
          npm install --global agent-browser@0.35.0 --ignore-scripts --registry https://registry.npmjs.org
          agent-browser install
          node packages/cli/dist/sunat.js --output json doctor > packages/cli/evidence/node-shim.json
          Select-String -Path packages/cli/evidence/node-shim.json -Pattern "agent-browser 0.35.0"
      - name: Verify browser, Windows credential storage, and config privacy
        shell: pwsh
        run: |
          $cli = Resolve-Path "packages/cli/dist/sunat.js"
          $evidence = Resolve-Path "packages/cli/evidence"
          $env:SUNAT_HOME = Join-Path $env:RUNNER_TEMP "sunat-cli-dogfood-home"
          $testSecret = "windows-keychain-dogfood-secret"
          $loginUrl = "https://api-seguridad.sunat.gob.pe/oauth2/login?originalUrl=https://e-menu.sunat.gob.pe/cl-ti-itmenu2/AutenticaMenuInternetPlataforma.htm"

          agent-browser --session sunat-proof open $loginUrl
          agent-browser --session sunat-proof wait --load domcontentloaded
          agent-browser --session sunat-proof screenshot (Join-Path $evidence "sunat-login-page.png")
          agent-browser --session sunat-proof snapshot -i > (Join-Path $evidence "sunat-login-page.txt")
          $openedUrl = agent-browser --session sunat-proof get url
          agent-browser --session sunat-proof close
          if ($openedUrl -notmatch "sunat.gob.pe") { throw "SUNAT login page did not open" }

          try {
            $testSecret | node $cli --output json keychain set SUNAT_PASSWORD --stdin > (Join-Path $evidence "keychain-set.json")
            bun -e 'import { saveConfig } from "./packages/cli/src/data/config.ts"; saveConfig({ ruc: "10123456789", usuario: "TESTUSER" });'
            $actualHash = bun -e 'import { createHash } from "node:crypto"; import { getCredentials } from "./packages/cli/src/data/config.ts"; process.stdout.write(createHash("sha256").update(getCredentials().password).digest("hex"));'
            $expectedHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($testSecret))).ToLower()
            if ($actualHash -ne $expectedHash) { throw "Windows Credential Manager returned a different secret" }
            "Exact secret hash round-trip: PASS" | Set-Content (Join-Path $evidence "credential-roundtrip.txt")

            $configPath = Join-Path $env:SUNAT_HOME "config.json"
            if (-not (Test-Path $configPath)) { throw "non-secret config was not persisted" }
            $configText = Get-Content $configPath -Raw
            $config = $configText | ConvertFrom-Json
            if ($config.ruc -ne "10123456789" -or $config.usuario -ne "TESTUSER") { throw "RUC or user was not persisted" }
            if ($configText -match "password|clave|$testSecret") { throw "plaintext secret found in config" }
            Copy-Item $configPath (Join-Path $evidence "config.json")
          } finally {
            node $cli --output json keychain clear SUNAT_PASSWORD > (Join-Path $evidence "keychain-clear.json")
          }

          $afterClear = bun -e 'import { getKeychainSecret } from "./packages/cli/src/data/keychain.ts"; process.stdout.write(getKeychainSecret("SUNAT_PASSWORD") ? "stored" : "missing");'
          if ($afterClear -ne "missing") { throw "Windows Credential Manager cleanup failed" }

          @"
          SUNAT CLI WINDOWS LOGIN: FIXED

          agent-browser 0.35.0: INSTALLED
          Chrome for Testing: INSTALLED
          SUNAT login page: OPENED

          Windows Credential Manager
          Store test Clave SOL: PASS
          Read from a fresh process: PASS
          Exact secret hash round-trip: PASS
          Clear after test: PASS

          config.json
          RUC persisted: 10123456789
          User persisted: TESTUSER
          Password in plaintext: NO

          The real Clave SOL belongs only in Windows Credential Manager.
          "@ | Set-Content (Join-Path $evidence "after.txt")
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: crafter-agents/cuse
          ref: main
          path: .cuse
          persist-credentials: false
      - name: Build cuse latest
        run: bun install --frozen-lockfile && bun build --compile src/cli.ts --outfile dist/cuse.exe
        working-directory: .cuse
      - id: cuse
        uses: crafter-agents/cuse@main
        with:
          scenario: tests/fixtures/windows-login-dogfood.json
          executable-path: .cuse/dist/cuse.exe
          working-directory: packages/cli
          evidence-name: sunat-windows-login
      - name: Upload cuse evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunat-windows-login
          path: |
            ${{ steps.cuse.outputs.evidence-path }}
            packages/cli/evidence
          if-no-files-found: error
